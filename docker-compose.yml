services:
  # Master coordinates the SeaweedFS cluster and tracks volume locations.
  seaweedfs-master:
    image: chrislusf/seaweedfs
    command:
      - master
      # Advertise the Compose service name for future SeaweedFS services.
      - -ip=seaweedfs-master
      # Listen on container interfaces so other services can connect.
      - -ip.bind=0.0.0.0
      - -port=9333
      # Store Master metadata in the persistent volume mounted below.
      - -mdir=/data
    ports:
      # Expose the Master HTTP endpoint only on the local host.
      - "127.0.0.1:9333:9333"
    volumes:
      - seaweedfs-master-data:/data
    restart: unless-stopped
    # Compose's default network provides service-name DNS resolution.
  # Volume Server stores data and registers with the Master over the Compose network.
  seaweedfs-volume:
    image: chrislusf/seaweedfs
    command:
      - volume
      - -master=seaweedfs-master:9333
      # Advertise the service name and listen on container interfaces.
      - -ip=seaweedfs-volume
      - -ip.bind=0.0.0.0
      - -port=8080
      # Store volume data in the persistent mount.
      - -dir=/data
    volumes:
      - seaweedfs-volume-data:/data
    depends_on:
      - seaweedfs-master
    restart: unless-stopped
    # Port 8080 stays internal to the Compose network; no host port mapping.

  # Filer manages file and directory metadata using a persistent local store.
  seaweedfs-filer:
    image: chrislusf/seaweedfs
    command:
      - filer
      - -master=seaweedfs-master:9333
      # Advertise the Compose service name and listen on container interfaces.
      - -ip=seaweedfs-filer
      - -ip.bind=0.0.0.0
      - -port=8888
    environment:
      # Supported filer store settings via SeaweedFS WEED_ environment variables.
      # Keep LevelDB2 metadata under the persistent /data mount.
      WEED_LEVELDB2_ENABLED: "true"
      WEED_LEVELDB2_DIR: /data/filerldb2
    volumes:
      - seaweedfs-filer-data:/data
    depends_on:
      - seaweedfs-master
      - seaweedfs-volume
    restart: unless-stopped
    # Port 8888 stays internal to the Compose network; no host port mapping.

  # S3 Gateway provides an S3-compatible API backed by the Filer.
  seaweedfs-s3:
    image: chrislusf/seaweedfs
    command:
      - s3
      - -filer=seaweedfs-filer:8888
      # Load static credentials from the read-only configuration file.
      - -config=/etc/seaweedfs/s3.json
      # Listen on container interfaces; restrict host access via the port mapping.
      - -ip.bind=0.0.0.0
      - -port=8333
    environment:
      # Require nonempty credentials from Compose variables for S3 authentication.
      SEAWEEDFS_S3_ACCESS_KEY: "${SEAWEEDFS_S3_ACCESS_KEY:?SEAWEEDFS_S3_ACCESS_KEY must be set}"
      SEAWEEDFS_S3_SECRET_KEY: "${SEAWEEDFS_S3_SECRET_KEY:?SEAWEEDFS_S3_SECRET_KEY must be set}"
    volumes:
      # Mount the existing S3 authentication configuration read-only.
      - ./infrastructure/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      # Expose the S3 API only on the local host.
      - "127.0.0.1:8333:8333"
    depends_on:
      - seaweedfs-filer
    restart: unless-stopped
    # Object data and metadata persist through existing services; no named gateway volume needed.

volumes:
  # Keep Master metadata across container recreation.
  seaweedfs-master-data:
  # Keep Volume Server data across container recreation.
  seaweedfs-volume-data:
  # Keep Filer metadata across container recreation.
  seaweedfs-filer-data:
